name: api-gateway CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'api-gateway/**'
  pull_request:
    branches: [main]
    paths:
      - 'api-gateway/**'

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-gateway
    env:
      SPRING_PROFILES_ACTIVE: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - run: chmod +x mvnw

      - name: Run tests
        run: ./mvnw test -B

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-api-gateway
          path: api-gateway/target/surefire-reports/

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: api-gateway
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - run: chmod +x mvnw

      - name: Build JAR
        run: ./mvnw package -DskipTests -B

      - name: Build Docker image
        run: docker build -t api-gateway:${{ github.sha }} .

      - name: Confirm build
        run: |
          echo "Docker image built: api-gateway:${{ github.sha }}"
          docker images api-gateway
