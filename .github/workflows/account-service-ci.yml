name: account-service CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'account-service/**'
  pull_request:
    branches: [main]
    paths:
      - 'account-service/**'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: account-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - run: chmod +x mvnw

      # Tests are commented out for now — no test infra (MySQL/Kafka/Eureka)
      # is available in the CI runner yet, and this service has no test
      # suite that needs it. Re-enable once tests exist and CI is set up
      # to provide the needed services (see securebank-api-ci.yml for the
      # pattern to follow once ready).
      # - name: Run tests
      #   run: ./mvnw test -B

      - name: Build JAR
        run: ./mvnw package -DskipTests -B

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: account-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - run: chmod +x mvnw

      - name: Build JAR
        run: ./mvnw package -DskipTests -B

      - name: Build Docker image
        run: docker build -t account-service:${{ github.sha }} .

      - name: Confirm build
        run: |
          echo "Docker image built: account-service:${{ github.sha }}"
          docker images account-service
