name: securebank-api CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'securebank-api/**'
  pull_request:
    branches: [main]
    paths:
      - 'securebank-api/**'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: securebank-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - run: chmod +x mvnw

      - name: Build JAR
        run: ./mvnw package -DskipTests -B

  dockr-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: securebank-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - run: chmod +x mvnw

      - name: Build JAR
        run: ./mvnw package -DskipTests -B

      - name: Build Docker image
        run: docker build -t securebank-api:${{ github.sha }} .

      - name: Confirm build
        run: |
          echo "Docker image built: securebank-api:${{ github.sha }}"
          docker images securebank-api
