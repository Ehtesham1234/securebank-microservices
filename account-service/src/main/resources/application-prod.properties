spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

eureka.instance.prefer-ip-address=true
eureka.client.service-url.defaultZone=${EUREKA_URL}
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

logging.level.root=WARN
logging.level.com.ehtesham.account=INFO

# C5 fix: AES-256 key (base64, 32 bytes) used to encrypt card numbers at
# rest. Generate with: openssl rand -base64 32
card.encryption.key=${CARD_ENCRYPTION_KEY}

# M8 fix: daily velocity caps per account, in addition to the
# per-transaction ceiling on the request DTOs. Tune to your actual
# risk/AML posture — these are placeholder defaults.
transaction.limits.daily-max-deposit=2000000.00
transaction.limits.daily-max-withdraw=1000000.00
transaction.limits.daily-max-transfer=1000000.00

# RS256: this service only ever VERIFIES tokens (public key) — it
# cannot mint one. Must be the public counterpart of securebank-api's
# jwt.private-key.
jwt.public-key=${JWT_PUBLIC_KEY}

# Follow-up #5 (Option A): HMAC key (base64, 32 bytes) used to
# deterministically derive CVVs from PAN + expiry — never stored.
# MUST be a different value from CARD_ENCRYPTION_KEY. Generate with:
#   openssl rand -base64 32
card.cvv.derivation-key=${CVV_DERIVATION_KEY}
