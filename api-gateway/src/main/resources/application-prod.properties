eureka.client.service-url.defaultZone=${EUREKA_URL}
eureka.instance.prefer-ip-address=true

# RS256: gateway only ever verifies (fail-fast at the edge); it never
# signs anything, since securebank-api is the only holder of the
# private key.
jwt.public-key=${JWT_PUBLIC_KEY}

# CORS fix: real frontend origin(s), comma-separated. No wildcard — this
# gateway allows credentialed CORS requests. This is now the ONLY place
# CORS is configured — see ApiGatewayApplication's CorsWebFilter bean.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}



logging.level.root=WARN
logging.level.org.springframework.cloud.gateway=INFO

spring.cloud.gateway.default-filters[0].name=Retry
spring.cloud.gateway.default-filters[0].args.retries=2
spring.cloud.gateway.default-filters[0].args.statuses=SERVICE_UNAVAILABLE
spring.cloud.gateway.default-filters[0].args.methods=GET,POST