spring.application.name=loan-service
server.port=8084

spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

spring.cloud.openfeign.circuitbreaker.enabled=true
spring.cloud.openfeign.client.config.default.connect-timeout=3000
spring.cloud.openfeign.client.config.default.read-timeout=5000

resilience4j.circuitbreaker.instances.account-service.register-health-indicator=true
resilience4j.circuitbreaker.instances.account-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.account-service.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.account-service.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.account-service.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.account-service.failure-rate-threshold=50
# Bug fix: feign.circuitbreaker routes ANY exception from a Feign call -
# including a legitimate 4xx client-error response - straight to
# AccountServiceClientFallback, which masked real signals (e.g. a 409 on
# a double-submitted EMI payment) behind a generic "service temporarily
# unavailable" message, and would also count normal client-error
# responses toward tripping the circuit open. Client errors aren't
# service failures, so they shouldn't do either - let them propagate to
# the caller as-is.
resilience4j.circuitbreaker.instances.account-service.ignore-exceptions=feign.FeignException.BadRequest,feign.FeignException.Conflict,feign.FeignException.UnprocessableEntity,feign.FeignException.NotFound

resilience4j.retry.instances.account-service.max-attempts=3
resilience4j.retry.instances.account-service.wait-duration=1s

# Bug fix: config for the new UserStatusClient (securebank-api) used by
# LoanServiceImpl.verifyLiveUserStatus() — same shape as account-service's.
resilience4j.circuitbreaker.instances.securebank-api.register-health-indicator=true
resilience4j.circuitbreaker.instances.securebank-api.sliding-window-size=10
resilience4j.circuitbreaker.instances.securebank-api.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.securebank-api.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.securebank-api.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.securebank-api.failure-rate-threshold=50

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

management.endpoints.web.exposure.include=health,info,circuitbreakers
management.health.circuitbreakers.enabled=true
management.endpoint.health.show-details=always

spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}